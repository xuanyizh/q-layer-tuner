name: Build Windows executable
on:
  push:
    branches: [main, windows-exe-v2.1]
    paths:
      - desktop.py
      - build_windows.py
      - WINDOWS.md
      - qlayer/**
      - dist/**
      - tools/build.py
      - tests/**
      - .github/workflows/windows.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static assets
        run: python tools/build.py
      - name: Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Browser runtime regression tests
        run: node --test tests/runtime.test.mjs tests/ui.test.mjs
      - name: Install pinned Windows packager
        run: python -m pip install pyinstaller==6.16.0
      - name: Package and test the executable
        run: python build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Q_Layer_Tuner_v2.1_Windows_x64
          path: windows-dist/*
          if-no-files-found: error
          retention-days: 90
